# Jialing: lantern light on graphite.
#
# Surfaces are cool, neutral graphite with no colour cast. One warm accent
# runs through the whole desktop: the amber of Hongyadong's lanterns, with an
# ember red on the focused-window outline. Every other colour is a terminal
# tone, softened so the amber stays the only thing that glows.
mode = "dark"

accent = "#F2A74E"
hyprland_active_border = "rgba(f0705fff) rgba(f2a74eff) 45deg"
hyprland_inactive_border = "rgba(3a3a4099)"
selection = "#352D22"
selection_foreground = "#F2F2F6"
muted = "#8F8F96"

background = "#121214"
dark_background = "#0D0D0F"
darker_background = "#09090B"
lighter_background = "#1D1D21"

foreground = "#D8D8DE"
dark_foreground = "#8A8A92"
light_foreground = "#E4E4EA"
bright_foreground = "#F2F2F6"

red = "#F0705F"
yellow = "#E8C266"
orange = "#F2A74E"
green = "#6FC283"
cyan = "#74C3DD"
blue = "#6E9EDC"
magenta = "#B994DE"
brown = "#A98C6A"

bright_red = "#F59488"
bright_yellow = "#F1D68A"
bright_green = "#93D6A3"
bright_cyan = "#9CD8EC"
bright_blue = "#93B8E8"
bright_magenta = "#CDB1EC"
