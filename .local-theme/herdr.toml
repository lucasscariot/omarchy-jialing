# Jialing's optional Herdr colours. The Omarchy theme hook applies these when
# Jialing is selected and removes them when another theme is selected.
[theme]
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#0D0D0F"
active_row_bg = "#1D1D21"
selection_bg = "#352D22"
# The two colours of the Hyprland focus gradient (hyprland.lua): lantern amber
# for the active tab, highlights and borders, ember red for alerts.
accent = "#F2A74E"
red = "#F0705F"
# Section headers ("machines", "agents"), row separators and sidebar controls:
# a muted amber so headers read as labels, not items.
overlay0 = "#C28F4A"
# Section rules and pane dividers, visible rather than near-black.
surface_dim = "#232328"
surface1 = "#2A2A30"
