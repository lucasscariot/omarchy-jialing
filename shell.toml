# Jialing: Omarchy shell surfaces.
#
# Mirrors colors.toml. Cards sit on a raised graphite surface (#18181B) under
# a 10 % white hairline, so amber appears only where something is focused,
# selected, or counting down, and the red-to-amber lantern gradient marks the
# edge of a notification. The bar is the darkest surface on
# screen so it recedes behind the windows.

[bar]
background       = "#0C0C0E"
background-alpha = 1.0
text             = "#D8D8DE"
# Modules calling attention to themselves (recording, voxtype, alerts, updates)
active           = "#F0705F"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "rgba(f0705fff) rgba(f2a74eff) 45deg"
active-border-foreground = "rgba(f0705fff) rgba(f2a74eff) 45deg"

[controls]
normal-color        = "#D8D8DE"
normal-fill-alpha   = 0.04
normal-border       = "#FFFFFF"
normal-border-width = 1
normal-border-alpha = 0.16

hover-cursor-color        = "#D8D8DE"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "#FFFFFF"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.22

# Keyboard focus is the one state that borrows the amber.
focus-color        = "#F2A74E"
focus-fill-alpha   = 0.08
focus-border       = "#F2A74E"
focus-border-width = 1
focus-border-alpha = 0.7

selected-color        = "#F2A74E"
selected-fill-alpha   = 0.14
selected-border       = "#F2A74E"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.2
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#18181B"
background-alpha = 1.0
text             = "#D8D8DE"
border           = "#FFFFFF"
border-alpha     = 0.10
border-width     = 1

[tooltip]
background       = "#18181B"
background-alpha = 0.98
text             = "#D8D8DE"
border           = "#FFFFFF"
border-alpha     = 0.10
border-width     = 1

[notifications]
background       = "#18181B"
background-alpha = 1.0
text             = "#D8D8DE"
# A lantern edge: the focus gradient as a hairline, thicker down the left.
border           = "hyprland.active-border"
border-alpha     = 0.9
border-width     = "1 1 1 3"
countdown        = "#F2A74E"

[launcher]
background                = "#121214"
background-alpha          = 1.0
text                      = "#D8D8DE"
border                    = "#FFFFFF"
border-alpha              = 0.10
border-width              = 1
scrim                     = "#000000"
scrim-alpha               = 0.45
# The chosen row is a flat tile with an amber label and no stroke: a 1-2 px
# edge lands between physical pixels at fractional scales and renders unevenly.
selected-background       = "#FFFFFF"
selected-background-alpha = 0.07
selected-text             = "#F2A74E"
selected-border           = "#F2A74E"
selected-border-alpha     = 0.0
selected-border-width     = 0

[menu]
background                = "#18181B"
background-alpha          = 1.0
text                      = "#D8D8DE"
border                    = "#FFFFFF"
border-alpha              = 0.10
border-width              = 1
scrim                     = "#000000"
scrim-alpha               = 0.35
# The chosen row is a flat tile with an amber label and no stroke: a 1-2 px
# edge lands between physical pixels at fractional scales and renders unevenly.
selected-background       = "#FFFFFF"
selected-background-alpha = 0.07
selected-text             = "#F2A74E"
selected-border           = "#F2A74E"
selected-border-alpha     = 0.0
selected-border-width     = 0

[polkit]
background       = "#18181B"
background-alpha = 1.0
text             = "#D8D8DE"
text-error       = "#F0705F"
# Idle opacity lives in the colour so border-alpha stays 1 and an error border
# is fully visible.
border           = "rgba(ffffff1a)"
border-error     = "#F0705F"
border-alpha     = 1.0
border-width     = 1
scrim            = "#000000"
scrim-alpha      = 0.45
accent           = "#F2A74E"

[lock]
background       = "#121214"
background-alpha = 0.88
text             = "#D8D8DE"
placeholder      = "#6E6E78"
text-error       = "#F0705F"
# The field is borderless in every state. The lock view draws border-active
# even at rest, and a hairline renders unevenly at fractional scales; the caret
# shows typing and the red message shows a wrong password.
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#F0705F"
border-alpha     = 1.0
border-width        = 0
border-active-width = 0
border-error-width  = 0
selection        = "#F2A74E"
selection-alpha  = 0.35

[image-picker]
text                    = "#D8D8DE"
selected-border         = "#F2A74E"
selected-border-alpha   = 1.0
unselected-border       = "#D8D8DE"
unselected-border-alpha = 0.25
